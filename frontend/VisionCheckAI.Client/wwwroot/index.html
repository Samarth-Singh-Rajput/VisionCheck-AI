<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VisionCheck AI</title>
    <base href="/" />

    <meta name="description" content="Industrial AI quality inspection for surface defects." />
    <meta name="color-scheme" content="dark light" />

    <link rel="icon" type="image/svg+xml" href="img/mark.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="css/theme.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/components.css" />

    <!-- Apply the stored theme before first paint so there is no flash. -->
    <script>
        (function () {
            try {
                var stored = window.localStorage.getItem('visioncheck.theme');
                document.documentElement.setAttribute('data-theme', stored === 'light' ? 'light' : 'dark');
            } catch (e) {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>

</head>

<body>
    <div id="app">
        <div class="route-status" role="status">Loading VisionCheck AI…</div>
    </div>

    <div id="blazor-error-ui" class="form-error" style="display:none; position:fixed; left:16px; bottom:16px; z-index:1000;">
        Something went wrong. Reload the page to continue.
        <a href="." class="reload" style="text-decoration:underline; margin-left:8px;">Reload</a>
        <span class="dismiss" style="cursor:pointer; margin-left:8px;" aria-hidden="true">✕</span>
    </div>

    <script src="js/app.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
